[package]
name = "neovide-tabs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
image = { version = "0.24.9", default-features = false, features = ["png"] }
libghostty-vt = "0.2.0"
libc = "0.2.177"
portable-pty = "0.9.0"
rmpv = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"

[target.'cfg(target_os = "macos")'.dependencies]
lru = "=0.16.3"
skia-safe = { version = "0.97.2", features = ["metal", "textlayout"] }
swash = { version = "=0.2.1", default-features = false, features = ["std"] }

[lints.rust]
rust_2018_idioms = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
